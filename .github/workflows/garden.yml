name: Update garden

on:
  schedule:
    - cron: "17 5 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch contributions and render the garden
        env:
          GITHUB_LOGIN: Shagshag
          GARDEN_CLIMATE: temperate-north  # voir le README pour les autres climats
          GARDEN_LANG: fr  # fr, en, ja ou hi
          # Optionnel : un token personnel (read:user) pour compter aussi les contributions privées
          GITHUB_TOKEN: ${{ secrets.GH_STATS_TOKEN || secrets.GITHUB_TOKEN }}
        run: |
          python fetch.py
          python render.py
      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data assets
          git diff --cached --quiet || (git commit -m "chore: update garden" && git push)
